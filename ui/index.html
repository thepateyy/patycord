<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>patycord</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1e1f22;
    color: #dcddde;
    font-family: -apple-system, Segoe UI, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 16px; margin: 0 0 12px; color: #fff; }
  .box {
    background: #2b2d31;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  label { font-size: 11px; text-transform: uppercase; color: #949ba4; display: block; margin-bottom: 4px; }
  .id-row { display: flex; gap: 6px; align-items: center; }
  #myId, #myName { font-family: monospace; font-size: 13px; background: #1e1f22; padding: 6px 8px; border-radius: 4px; flex: 1; user-select: all; overflow-wrap: anywhere; }
  button {
    background: #5865f2; color: #fff; border: none; border-radius: 4px;
    padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #4752c4; }
  button.secondary { background: #4e5058; }
  button.secondary:hover { background: #6d6f78; }
  input[type=text] {
    background: #1e1f22; border: 1px solid #3f4147; color: #dcddde;
    border-radius: 4px; padding: 7px 8px; font-size: 13px; width: 100%;
  }
  .connect-row { display: flex; gap: 6px; margin-top: 8px; }
  .connect-row input { flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #3f4147; font-size: 12px; }
  li:last-child { border-bottom: none; }
  li .name { font-family: -apple-system, Segoe UI, sans-serif; }
  li .id { font-family: monospace; color: #949ba4; font-size: 11px; }
  li .status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4e5058; flex-shrink: 0; }
  .dot.online { background: #23a55a; }
  .removeBtn { background: transparent; color: #949ba4; padding: 2px 6px; font-size: 14px; }
  .removeBtn:hover { background: #da373c; color: #fff; }
  #status { font-size: 12px; color: #949ba4; margin-top: 8px; white-space: pre-wrap; }
  #muteBtn.muted { background: #da373c; }
  .empty { color: #6d6f78; font-size: 12px; padding: 4px 0; }
  .incomingCall {
    background: #3a3d5c; border: 1px solid #5865f2; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .acceptBtn { background: #23a55a; }
  .acceptBtn:hover { background: #1a7d44; }
  .declineBtn { background: #da373c; }
  .declineBtn:hover { background: #a52b2f; }
  #toasts {
    position: fixed; top: 12px; right: 12px; left: 12px;
    display: flex; flex-direction: column; gap: 6px; z-index: 100;
  }
  .toast {
    background: #2b2d31; border-left: 3px solid #da373c; color: #fff;
    border-radius: 4px; padding: 10px 12px; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    animation: toast-in 0.15s ease-out;
  }
  .toast.info { border-left-color: #5865f2; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
  #screenGrid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px; margin-bottom: 12px;
  }
  .screenTile { position: relative; background: #000; border-radius: 6px; overflow: hidden; }
  .screenTile video { width: 100%; display: block; }
  .screenTile .label {
    position: absolute; bottom: 4px; left: 6px; font-size: 11px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 3px;
  }
  #shareScreenBtn.sharing { background: #da373c; }
  #usernameModal[hidden] { display: none; }
  #usernameModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  #usernameModal .box { width: min(280px, 90%); margin: 0; }
  #usernameModal p { margin: 0 0 10px; font-size: 13px; color: #dcddde; }
  .editNameBtn { background: transparent; color: #949ba4; padding: 2px 6px; font-size: 12px; }
  .editNameBtn:hover { background: #4e5058; color: #fff; }
</style>
</head>
<body>
  <h1>patycord</h1>

  <div id="toasts"></div>
  <div id="incomingCalls"></div>
  <div id="screenGrid"></div>

  <div id="usernameModal" hidden>
    <div class="box">
      <p>What should people see when you call them?</p>
      <div class="connect-row">
        <input type="text" id="usernameInput" placeholder="your name" maxlength="40">
        <button id="usernameSaveBtn">Continue</button>
      </div>
    </div>
  </div>

  <div class="box">
    <label>Your name</label>
    <div class="id-row">
      <div id="myName">—</div>
      <button id="editNameBtn" class="secondary editNameBtn">Edit</button>
    </div>
  </div>

  <div class="box">
    <label>Your ID (share this to let others join you)</label>
    <div class="id-row">
      <div id="myId">connecting…</div>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
  </div>

  <div class="box">
    <label>Add a friend (one-time — swap IDs once, never again)</label>
    <div class="connect-row">
      <input type="text" id="peerIdInput" placeholder="their ID">
      <button id="callBtn">Add</button>
    </div>
  </div>

  <div class="box">
    <label>Friends (<span id="peerCount">0</span> in call)</label>
    <ul id="peerList"></ul>
  </div>

  <button id="muteBtn">Mute</button>
  <button id="shareScreenBtn" class="secondary">Share screen</button>
  <button id="retryMicBtn" class="secondary">Retry mic access</button>

  <div id="status"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
