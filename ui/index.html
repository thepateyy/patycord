<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>patycord</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1e1f22;
    color: #dcddde;
    font-family: -apple-system, Segoe UI, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 16px; margin: 0 0 12px; color: #fff; }
  .box {
    background: #2b2d31;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  label { font-size: 11px; text-transform: uppercase; color: #949ba4; display: block; margin-bottom: 4px; }
  .id-row { display: flex; gap: 6px; align-items: center; }
  #myId { font-family: monospace; font-size: 13px; background: #1e1f22; padding: 6px 8px; border-radius: 4px; flex: 1; user-select: all; overflow-wrap: anywhere; }
  button {
    background: #5865f2; color: #fff; border: none; border-radius: 4px;
    padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #4752c4; }
  button.secondary { background: #4e5058; }
  button.secondary:hover { background: #6d6f78; }
  input[type=text] {
    background: #1e1f22; border: 1px solid #3f4147; color: #dcddde;
    border-radius: 4px; padding: 7px 8px; font-size: 13px; width: 100%;
  }
  .connect-row { display: flex; gap: 6px; margin-top: 8px; }
  .connect-row input { flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #3f4147; font-family: monospace; font-size: 12px; }
  li:last-child { border-bottom: none; }
  #status { font-size: 12px; color: #949ba4; margin-top: 8px; white-space: pre-wrap; }
  #muteBtn.muted { background: #da373c; }
</style>
</head>
<body>
  <h1>patycord</h1>

  <div class="box">
    <label>Your ID (send this to a friend)</label>
    <div class="id-row">
      <div id="myId">connecting…</div>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
  </div>

  <div class="box">
    <label>Connect to a friend</label>
    <div class="connect-row">
      <input type="text" id="peerIdInput" placeholder="paste their ID here">
      <button id="callBtn">Call</button>
    </div>
  </div>

  <div class="box">
    <label>In this call (<span id="peerCount">0</span>)</label>
    <ul id="peerList"></ul>
  </div>

  <button id="muteBtn">Mute</button>
  <button id="retryMicBtn" class="secondary">Retry mic access</button>

  <div id="status"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
