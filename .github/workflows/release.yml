name: Release

# Cutting a release: bump the version in package.json, src-tauri/Cargo.toml
# and src-tauri/tauri.conf.json, commit, then `git tag vX.Y.Z && git push --tags`.
# This builds the NSIS installer, signs it, and publishes a GitHub Release
# (including the `latest.json` manifest the app's auto-updater reads) —
# nothing else to do by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to diff against the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      # Release notes = the commit subjects since the last tag. Not GitHub's
      # own PR-based auto-notes, since this repo mostly commits straight to
      # dev rather than going through PRs — that API would come back sparse.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            git log "$RANGE" --no-merges --pretty=format:"- %s"
            echo ""
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'patycord ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
