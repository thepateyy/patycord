name: Release

# Cutting a release: bump the version in package.json, src-tauri/Cargo.toml
# and src-tauri/tauri.conf.json, commit, then `git tag vX.Y.Z && git push --tags`.
# This builds the NSIS installer, signs it, and publishes a GitHub Release
# (including the `latest.json` manifest the app's auto-updater reads) —
# nothing else to do by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'patycord ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
