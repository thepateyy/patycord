name: Release

# Cutting a release: bump the version in package.json, src-tauri/Cargo.toml
# and src-tauri/tauri.conf.json, commit, then `git tag vX.Y.Z && git push --tags`.
# This builds the NSIS installer, signs it, and publishes a GitHub Release
# (including the `latest.json` manifest the app's auto-updater reads) —
# nothing else to do by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history to diff against the previous tag

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      # Release notes = the commit subjects since the last tag. Not GitHub's
      # own PR-based auto-notes, since this repo mostly commits straight to
      # dev rather than going through PRs — that API would come back sparse.
      #
      # The previous release is the highest other v* tag by version, not
      # `git describe`: the v0.1.5 tag sits on a commit a history rewrite left
      # off main, so describe found no tag at all and 0.1.6's notes listed the
      # entire project history. And a symmetric range with --cherry-pick
      # --right-only rather than PREV..HEAD, which drops any commit whose
      # change already shipped under a different hash — so it works whether or
      # not the previous tag is an ancestor. Version bumps are left out as noise.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG...HEAD" --no-merges --cherry-pick --right-only --pretty=format:"- %s")
          else
            LOG=$(git log HEAD --no-merges --pretty=format:"- %s")
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$LOG" | grep -v '^- Bump version' || true
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'patycord ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
