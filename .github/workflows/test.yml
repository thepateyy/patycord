name: Test

# The end-to-end suite in tests/: real instances of the app in Chromium, adding
# each other, calling (with audio checked end to end), messaging while offline,
# and turning away a stranger's call — through a local signaling server, so it
# needs no network access. Runs on every push to dev/main and on pull requests,
# so breakage shows up before a release is tagged.
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm test

      - name: Keep traces and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
