[package]
name = "patycord"
version = "0.1.8"
description = "Barebones P2P voice chat for friends."
edition = "2021"

[lib]
name = "patycord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "~2.5" # 2.6+ needs tauri 2.12, whose wry needs a newer webview2-com than the one pinned below
tauri-plugin-single-instance = "~2.4" # same: 2.5+ needs tauri 2.12
tauri-plugin-notification = "~2.4" # 2.5+ needs tauri 2.12, see above

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Cryptography",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
