<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- patycord's mark: a P whose bowl doesn't stop back at the stem but carries
       on around it into a full ring, crossing in front of the stem on the way.
       Regenerate the app icons after editing: render this to source.png
       (1024x1024), then `npx tauri icon src-tauri/icons/source.png`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7ff5"/>
      <stop offset="1" stop-color="#132f6b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- a gap in the stem either side of where the ring crosses in front of it:
         just the stretch of ring from 85° to 140°, drawn wider than the stroke -->
    <mask id="stemMask" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M 529.4 599.2 A 200 200 0 0 1 358.8 528.6" fill="none" stroke="#000" stroke-width="104"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="225" fill="url(#shine)"/>
  <!-- The stem's top is flat and sits wholly inside the ring's stroke, so it
       grows straight out of the ring; its bottom end is rounded. -->
  <g mask="url(#stemMask)" fill="#fff">
    <rect x="404" y="215" width="64" height="605"/>
    <circle cx="436" cy="820" r="32"/>
  </g>
  <circle cx="512" cy="400" r="200" fill="none" stroke="#fff" stroke-width="64"/>
</svg>
